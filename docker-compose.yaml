# Production: three containers.
#   client  Caddy on :80, the only service reachable from outside. Serves the
#           static build and proxies /colyseus/* to the game server.
#   server  The compiled game server, on the internal network only. It also
#           holds the accounts (sign-in, usernames, stats) in the database.
#   db      Postgres, on the internal network only, its data in the `pgdata`
#           volume. The server creates and updates the tables itself at boot.
#
# On Coolify, give the `client` service the domain (port 80); Coolify's proxy
# adds TLS in front. Leave `server` and `db` without a domain.
# Locally: docker compose --env-file .env.production.local \
#   -f docker-compose.yaml -f docker-compose.local.yaml up --build
# Every variable is listed in .env.production.example.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    expose:
      - "2567"
    environment:
      NODE_ENV: production
      PORT: "2567"
      DATABASE_URL: postgres://bagarre:${POSTGRES_PASSWORD}@db:5432/bagarre
      PUBLIC_URL: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JEV_DAILY_BUDGET_USD: ${JEV_DAILY_BUDGET_USD:-}
      # Error tracking (Sentry protocol), our self-hosted Rustrak. Public ingest
      # key, so it has a committed default: the container gets it with no
      # Coolify env var. Only read at runtime (process.env.SENTRY_DSN).
      SENTRY_DSN: ${SENTRY_DSN:-https://7be5b705786c413796e0dbb26dc464b7@rustrack.bazlab.si/4}
      # The release tag every event and session carries: the deploy's commit
      # sha (SOURCE_COMMIT, which Coolify sets), unless overridden explicitly.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-${SOURCE_COMMIT:-}}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/bagarre-server", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-/colyseus}
        # Same public key as the server's SENTRY_DSN, inlined into the browser
        # bundle at build time (import.meta.env.VITE_SENTRY_DSN).
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-https://7be5b705786c413796e0dbb26dc464b7@rustrack.bazlab.si/4}
        # The release tag inlined into the bundle at build time (vite.config.ts):
        # the deploy's commit sha (SOURCE_COMMIT), unless overridden explicitly.
        SENTRY_RELEASE: ${SENTRY_RELEASE:-${SOURCE_COMMIT:-}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: bagarre
      POSTGRES_DB: bagarre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagarre -d bagarre"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
