# Build, typecheck, lint, smoke and the Playwright e2e suite.
#
# No secrets: the repo is public and this workflow needs none. Without a
# .env.local the game runs guest-only, which is all the checks need:
# - smoke: the live Convex checks in smoke-accounts.ts (CONVEX_URL +
#   GAME_SERVER_SECRET) print SKIP; the account logic is still checked
#   against convex-test and locally signed tokens.
# - e2e: always guests (no Clerk key); its game server reads no env file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml before a tagged deploy.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Smoke
        run: bun run smoke

      - name: Playwright version
        id: pw
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/e2e
        run: bunx playwright install-deps chromium

      - name: E2E
        run: bun run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
