# Build, typecheck, lint, smoke and the Playwright e2e suite.
#
# Three kinds of jobs run side by side, so the run takes as long as its
# slowest job instead of the sum of all steps:
#   check  install, build, typecheck, lint, map fairness, unit tests
#   smoke  the headless server smoke test
#   e2e    the Playwright suite split into 4 shards, one job each
#
# No secrets: the repo is public and this workflow needs none. The smoke and
# e2e servers keep their accounts in an in-memory database (PGlite) and sign
# tokens with the dev-only JWT secret, so no Postgres, Docker or env file.
#
# release.yml calls this workflow and deploys only once every job here is green.
name: CI

on:
  # Not on pushes to main: every change lands through a PR, and release.yml
  # runs this workflow again before each deploy.
  pull_request:
  # Reused by release.yml before a tagged deploy.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Map fairness
        # The duel and FFA validators: layout rules plus the side-by-side fairness checks.
        working-directory: packages/shared
        run: bun scripts/validate.ts && bun scripts/ffa/validate.ts

      - name: Unit tests
        # Every package's bun:test files (turbo runs each package's `test`
        # script): the shared rules and maps, and the client's spectate model.
        # Not the Playwright specs, which are the e2e job's.
        run: bun run test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Smoke
        # The server runs from source, so no build is needed first.
        run: bun run smoke

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard must not cancel the others: every shard's failures are worth seeing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/e2e
        run: bunx playwright install-deps chromium

      - name: E2E
        # Playwright directly rather than `bun run e2e` (turbo), to pass the shard.
        # Its webServer builds the client and starts the game server itself.
        working-directory: apps/e2e
        run: bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # One name per shard: upload-artifact v4 refuses a name that already exists.
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
