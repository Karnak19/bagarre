<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bagarre</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ff6b4a%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div class="player" id="hud-me">
          <div class="name">You</div>
          <div class="hp"><div class="fill"></div></div>
        </div>
        <div class="score" id="hud-score">0 - 0</div>
        <div class="player right" id="hud-opp">
          <div class="name">Opponent</div>
          <div class="hp"><div class="fill"></div></div>
        </div>
      </div>
      <div id="hud-status">Connecting...</div>
      <div id="hud-map" hidden>
        <div class="title"></div>
        <div class="sub"></div>
      </div>
      <div id="hud-banner" hidden>
        <div class="title"></div>
        <div class="sub"></div>
      </div>
      <div id="hud-bottom">
        <div id="hud-weapon">
          <div class="wname"></div>
          <div class="ammo"></div>
          <div class="reload"><div class="fill"></div></div>
        </div>
        <div class="ability" id="ab-dash"><div class="cd"></div><div class="key">Space</div><div class="label">Dash</div><div class="t"></div></div>
        <div class="ability" id="ab-grenade"><div class="cd"></div><div class="key">Q</div><div class="label">Grenade</div><div class="t"></div></div>
        <div class="ability" id="ab-shield"><div class="cd"></div><div class="key">E</div><div class="label">Shield</div><div class="t"></div></div>
      </div>
      <div id="hud-picker"></div>
      <div id="hud-debug"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Account widget (Clerk sign-in, username). Separate entry, see src/accountUi.ts. -->
    <script type="module" src="/src/accountUi.ts"></script>
  </body>
</html>
